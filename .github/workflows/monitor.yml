name: TML Queue Monitor

on:
  schedule:
    - cron: '*/2 * * * *'   # Every 2 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI

permissions:
  contents: write
  actions: write

jobs:
  check-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Restore previous state (so we know if status changed)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tml-queue-state

      # Run the monitor
      - name: Check queue status
        env:
          USERS: ${{ secrets.USERS }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      # Save state for next run (always, even if monitor fails)
      # Delete old cache first (keys are immutable)
      - name: Delete old state cache
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete tml-queue-state --repo ${{ github.repository }} 2>/dev/null || true

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tml-queue-state

      # Publish status to dashboard (gh-pages)
      - name: Generate dashboard status
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone
          try:
              with open('state.json', 'r') as f:
                  state = json.load(f)
          except:
              state = {'users': {}, 'system_healthy': False, 'last_run': None}

          dashboard = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'last_run': state.get('last_run'),
              'system_healthy': state.get('system_healthy', False),
              'users': {}
          }
          for uid, udata in state.get('users', {}).items():
              email = udata.get('email', '?')
              parts = email.split('@')
              masked = parts[0][:3] + '***@' + parts[-1] if '@' in email else email
              dashboard['users'][uid[:8]] = {
                  'email': masked,
                  'status': udata.get('status', 'unknown'),
                  'last_checked': udata.get('last_checked', ''),
                  'full_response': udata.get('full_response', {}),
              }

          os.makedirs('_dashboard_publish/data', exist_ok=True)
          with open('_dashboard_publish/data/status.json', 'w') as f:
              json.dump(dashboard, f, indent=2)
          print(f"  Dashboard status generated: {len(dashboard['users'])} users")
          PYEOF

      - name: Deploy status to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_dashboard_publish
          keep_files: true
          publish_branch: gh-pages
